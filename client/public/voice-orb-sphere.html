<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Sphere</title>
<style>
  :root { --bg: #F5F5F7; --text: #1D1D1F; --muted: #6E6E73; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #ambient { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  canvas#sphere { width: 320px; height: 320px; display: block; }
  .label { font-size: 15px; color: var(--muted); height: 20px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .controls button {
    font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 980px;
    border: 1px solid #D2D2D7; background: rgba(255,255,255,0.85); color: var(--text); cursor: pointer;
    transition: border-color 200ms ease, color 200ms ease;
  }
  .controls button.active { border-color: #0071E3; color: #0071E3; }
</style>
</head>
<body>

<canvas id="ambient"></canvas>

<div class="content">
  <canvas id="sphere" width="640" height="640"></canvas>
  <div class="label" id="label">Tap to speak</div>
  <div class="controls">
    <button data-state="idle" class="active">Idle</button>
    <button data-state="listening">Listening</button>
    <button data-state="thinking">Thinking</button>
    <button data-state="speaking">Speaking</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("sphere");
  const ctx = canvas.getContext("2d");
  const amb = document.getElementById("ambient");
  const actx = amb.getContext("2d");
  const label = document.getElementById("label");
  const buttons = document.querySelectorAll(".controls button");

  const TIME_SCALE = 0.35; // keeps every motion calm; raise for faster

  const labels = { idle: "Tap to speak", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking…" };
  const ambientColors = {
    idle: [143, 193, 247], listening: [120, 200, 230],
    thinking: [185, 170, 240], speaking: [245, 190, 150]
  };

  // Dot color per state. Every state gets its own tint, not just the glow.
  const dotColors = {
    idle:      [0, 113, 227],
    listening: [0, 140, 210],
    thinking:  [110, 90, 215],
    speaking:  [215, 115, 60]
  };

  // Points spread evenly over a sphere (Fibonacci lattice)
  const N = 260;
  const points = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = golden * i;
    points.push({ x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, seed: Math.random() * Math.PI * 2 });
  }

  // Size, shape and dot size stay fixed across states so the sphere never grows or shrinks.
  // Only spin speed, tilt and dot brightness change per state.
  const presets = {
    idle:      { spin: 0.20, flatten: 0, tilt: 0.25, size: 1.8, alpha: 0.60 },
    listening: { spin: 0.45, flatten: 0, tilt: 0.45, size: 1.8, alpha: 0.65 },
    thinking:  { spin: 1.00, flatten: 0, tilt: 0.15, size: 1.8, alpha: 0.60 },
    speaking:  { spin: 0.30, flatten: 0, tilt: 0.35, size: 1.8, alpha: 0.65 }
  };

  let state = "idle";
  let cur = { ...presets.idle };
  let glow = [...ambientColors.idle];
  let time = 0, last = performance.now();
  let rot = 0;
  let dotRGB = [...dotColors.idle];

  function resizeAmb() { amb.width = innerWidth; amb.height = innerHeight; }
  addEventListener("resize", resizeAmb);
  resizeAmb();

  function level(t, s) {
    if (s === "listening") return 0.5 + 0.5 * Math.sin(t * 4.1) * Math.sin(t * 1.7 + 0.5);
    if (s === "speaking")  return 0.3 + 0.7 * Math.abs(Math.sin(t * 5.5) * Math.cos(t * 2.3));
    return 0;
  }

  function drawAmbient(alpha) {
    const w = amb.width, h = amb.height;
    actx.clearRect(0, 0, w, h);
    const [r, g, b] = glow;
    const grad = actx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.6);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    actx.fillStyle = grad;
    actx.fillRect(0, 0, w, h);
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt * TIME_SCALE;

    const target = presets[state];
    const k = 1 - Math.pow(0.001, dt);
    for (const key in target) cur[key] += (target[key] - cur[key]) * k;
    const gc = ambientColors[state];
    for (let i = 0; i < 3; i++) glow[i] += (gc[i] - glow[i]) * k;
    const dc = dotColors[state];
    for (let i = 0; i < 3; i++) dotRGB[i] += (dc[i] - dotRGB[i]) * k;

    const lvl = level(time, state);
    drawAmbient(0.12 + lvl * 0.04);

    rot += cur.spin * dt * TIME_SCALE * 4;
    const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
    const R = W * 0.32;

    ctx.clearRect(0, 0, W, H);

    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    const tiltA = Math.sin(cur.tilt * Math.PI) * 0.6;
    const cosT = Math.cos(tiltA), sinT = Math.sin(tiltA);

    const projected = [];
    for (const p of points) {
      // squash toward the equatorial plane and bulge outward with the voice
      let y = p.y * (1 - cur.flatten * 0.85);
      const bulgeScale = 1;
      let x = p.x * bulgeScale;
      let z = p.z * bulgeScale;

      // rotate around Y axis
      let x1 = x * cosR + z * sinR;
      let z1 = -x * sinR + z * cosR;
      // tilt around X axis
      let y2 = y * cosT - z1 * sinT;
      let z2 = y * sinT + z1 * cosT;

      const persp = 1 / (1.8 - z2 * 0.4);
      projected.push({
        sx: cx + x1 * R * persp,
        sy: cy + y2 * R * persp,
        depth: (z2 + 1) / 2,
        persp
      });
    }

    projected.sort((a, b) => a.depth - b.depth);
    for (const p of projected) {
      const size = cur.size * p.persp * (0.8 + p.depth * 0.6);
      const alpha = Math.min(1, (cur.alpha + lvl * 0.2) * (0.2 + p.depth * 0.8));
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, Math.max(size, 0.6), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${dotRGB[0] | 0},${dotRGB[1] | 0},${dotRGB[2] | 0},${alpha.toFixed(3)})`;
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  function setState(s) {
    state = s;
    label.textContent = labels[s];
    buttons.forEach(b => b.classList.toggle("active", b.dataset.state === s));
  }
  buttons.forEach(b => b.addEventListener("click", () => setState(b.dataset.state)));

  setState("idle");
  requestAnimationFrame(frame);
</script>

</body>
</html>
